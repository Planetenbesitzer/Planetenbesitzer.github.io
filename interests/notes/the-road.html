      <h1 class="page-title">前路</h1>
      <article class="poem" aria-label="前路">
        <figure><img src="../../my_way/my_way.assets/通向物理边界.jpg" alt="通向物理边界" loading="lazy"></figure>
<p>向青草更青处漫溯。<br>
我要轻轻关上联通现实的门，<br>
扎进涩中带着甜的浆，<br>
不理睬潜得深会不会溺亡。</p>
<p>向青草更青处漫溯。<br>
我要用光速击打毫末，<br>
再轻轻把宇宙打个结，<br>
不理睬身旁华灯辉煌，人声喧嚷。</p>
<p>向青草更青处漫溯。<br>
诗情句意永是不足，<br>
纠结惆怅绕梁，<br>
微风吹拂着偏航。<br>
我要等待，<br>
亿万光年的黑暗中撞上恒星的光芒。</p>
