<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="icon" href="{{ '/assets/img/mark.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body class="directory-page">
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="directory-shell">
      <header class="directory-header">
        <a class="brand" href="{{ '/' | relative_url }}">Shu-Tao Zhang</a>
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="{{ '/' | relative_url }}">Home</a><span aria-hidden="true">/</span><a href="{{ '/interests/' | relative_url }}">Interests</a></nav>
      </header>
      <main id="content" tabindex="-1" class="legacy-content">{{ content }}</main>
      <footer class="site-footer"><a href="{{ '/interests/notes/' | relative_url }}">← Notes &amp; writing</a><span>Shu-Tao Zhang · Peking University</span></footer>
    </div>
  </body>
</html>
